name: Actualizar Kobo a Looker

on:
  schedule:
    # Se ejecuta en el minuto 15 de cada hora
    # PERO solo de Lunes (1) a Viernes (5)
    - cron: '15 * * * 1-5'
  workflow_dispatch: # Permite ejecutar manualmente cualquier día si hace falta

jobs:
  run-etl-process:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        # Geopandas necesita libspatialindex para índices espaciales
        # GeoJSON nativo — sin GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev

      - name: Instalar librerías de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Script Principal
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/main_act_flash.py

      - name: Enriquecer fecha_reporte e inicio_semana_lunes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/enriquecer_base.py
